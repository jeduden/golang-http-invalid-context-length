name: HTTP Response Investigation Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    
    - name: Display Go version
      run: go version
    
    - name: Run tests with verbose output
      run: |
        echo "Running tests..."
        go test -v 2>&1 | tee test_output.txt
        TEST_EXIT_CODE=${PIPESTATUS[0]}
        echo "Test exit code: $TEST_EXIT_CODE"
        exit $TEST_EXIT_CODE
    
    - name: Generate test summary
      if: always()
      run: |
        echo "# HTTP Response Investigation Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Output" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat test_output.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Extract key findings
        echo "## Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if grep -q "FAIL" test_output.txt; then
          echo "❌ **Some tests failed**" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ **All tests passed**" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Count test cases
        TOTAL_TESTS=$(grep -c "^=== RUN" test_output.txt || echo "0")
        PASSED_TESTS=$(grep -c "^--- PASS:" test_output.txt || echo "0")
        echo "- Total test cases: $TOTAL_TESTS" >> $GITHUB_STEP_SUMMARY
        echo "- Passed: $PASSED_TESTS" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Show validation results
        echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 204 No Content Responses" >> $GITHUB_STEP_SUMMARY
        grep "✓ Status 204" test_output.txt | while read line; do
          echo "- $line" >> $GITHUB_STEP_SUMMARY
        done
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Content-Length Constraints" >> $GITHUB_STEP_SUMMARY
        grep "✓ Body.*<= Content-Length" test_output.txt | while read line; do
          echo "- $line" >> $GITHUB_STEP_SUMMARY
        done
