name: HTTP Response Investigation Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    
    - name: Display Go version
      run: go version
    
    - name: Run tests with verbose output
      run: go test -v
    
    - name: Print summary
      if: always()
      run: |
        echo "=========================================="
        echo "Test Summary"
        echo "=========================================="
        echo "All test cases completed."
        echo "Check the test output above for detailed analysis."
        echo "=========================================="
